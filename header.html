<!DOCTYPE html>
<html>
<head>
  <!-- Loads the Ruffle program directly on GitHub -->
  <script src="https://unpkg.com"></script>
</head>
<body style="margin:0; padding:0; overflow:hidden; background:transparent;">

  <!-- This container will hold your Flash player smoothly -->
  <div id="flash-container" style="width: 760px; height: 220px;"></div>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
        scale: "showAll",
        forceScale: true
    };

    window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("flash-container");
        container.appendChild(player);
        
        // This injects the file directly via JS so your browser won't throw an error!
        player.load("simps_header.swf");
        
        player.style.width = "100%";
        player.style.height = "100%";
    });
  </script>

</body>
</html>
